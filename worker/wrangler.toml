# Configuración de despliegue del Worker (Cloudflare)
name = "sellerbrain-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# Cron HORARIO ("0 * * * *"): cada hora hace la foto de PPC + refresco ligero de
# ventas; a las 03:00 UTC corre la ingesta completa; a las 04:00 el cierre de PPC.
# IMPORTANTE: si pegas el worker a mano en Cloudflare, este archivo NO se aplica —
# cambia el disparador en el panel: Workers & Pages → tu worker → Settings →
# Triggers → Cron Triggers → deja "0 * * * *" (borra "0 3 * * *").
[triggers]
crons = ["0 * * * *"]

# Los SECRETOS no van aquí — se ponen con:  wrangler secret put NOMBRE
# o en el panel de Cloudflare. Secretos necesarios:
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, SB_API_KEY,
#   ADS_CLIENT_ID, ADS_CLIENT_SECRET, ADS_REFRESH_TOKEN
#   (SP-API, pendiente: LWA_CLIENT_ID, LWA_CLIENT_SECRET, SPAPI_REFRESH_TOKEN)
