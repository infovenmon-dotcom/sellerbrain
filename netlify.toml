# Configuración de Netlify — SellerBrain (ENTORNO DE PRUEBAS)
# Sitio estático puro. El login se valida en el Worker (Cloudflare), así que
# ya no hace falta generar config.js ni variables de entorno.
[build]
  publish = "."
  # AHORRO DE CRÉDITO: solo desplegar cuando cambie algo del FRONTEND.
  # El comando 'ignore' que sale con código 0 => se SALTA el deploy.
  # Comparamos contra el ÚLTIMO commit YA DESPLEGADO ($CACHED_COMMIT_REF), no solo
  # contra HEAD^ — así, si se empujan varios commits juntos y alguno tocó el frontend,
  # NO se pierde el despliegue. Si CACHED_COMMIT_REF está vacío (primer build) el diff
  # falla => sale != 0 => despliega (lo seguro). worker.js, sql/, docs/ no cuentan.
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-HEAD^} $COMMIT_REF -- '*.html' 'assets/**' '_headers' '_redirects' 'favicon.svg' 'favicon.ico' 'netlify.toml'"
